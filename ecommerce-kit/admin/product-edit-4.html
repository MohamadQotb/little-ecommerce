    <a class="navbar-brand" href="index.html">little store<span class="fw-normal fs-6"> / admin</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link " href="index.html">Overview</a></li>

<!-- PAGE CONTENT START -->
<main class="container py-4 py-lg-5">
<div class="section-top"><div><p class="eyebrow mb-2">Catalog</p><h1 class="h2 mb-0">Edit product</h1></div><a href="products.html">← Products</a></div><div class="panel"><form><div class="row"><div class="col-md-8"><div class="mb-3"><label class="form-label" for="name">Product name</label><input class="form-control" id="name" name="name" type="text" value="Desk Lamp" required></div><div class="mb-3"><label class="form-label" for="category_id">Category</label><select class="form-select" id="category_id" name="category_id"><option value="2">Home</option><option value="1">Bags</option><option value="3">Electronics</option><option value="4">Clothing</option><option value="5">Accessories</option></select></div><div class="mb-3"><label class="form-label" for="description">Description</label><textarea id="description" name="description" class="form-control" rows="4">A practical essential with a clean design.</textarea></div></div><div class="col-md-4"><div class="mb-3"><label class="form-label" for="price">Price (EGP)</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.01" value="650" required></div><div class="mb-3"><label class="form-label" for="stock">Stock</label><input class="form-control" id="stock" name="stock" type="number" min="0" step="1" value="12" required></div><div class="mb-3"><label class="form-label" for="image">Product image</label><input class="form-control" id="image" name="image" type="file" value="" ></div></div></div><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#demoModal">Save product</button> <a class="btn btn-light" href="products.html">Cancel</a></form></div>
</main>
<!-- PAGE CONTENT END -->
<!-- FOOTER START: intentionally repeated. -->
<footer class="site-footer"><div class="container d-flex flex-wrap justify-content-between gap-2"><span>Little Store · Everyday essentials.</span><span>Store administration</span></div></footer>
<!-- FOOTER END -->

  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="demoTitle">Static preview</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">This is a frontend template. No data was saved, deleted or submitted.</div>
    <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">Got it</button></div>
  </div></div>
</div>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
</body>
